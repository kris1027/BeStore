name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Hooks are for local commits only.
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
      # Only the db suites use a database. DIRECT_URL stays unset on purpose: the test:db
      # guard refuses a TEST_DATABASE_URL that matches it, and the runner migrates the test DB itself.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bestore_test
    services:
      postgres:
        # Same major version as the Supabase stack (supabase/config.toml).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
