name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Hooks are for local commits only.
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
      # spec 0011, AC-16: nothing in CI sends a real email. Unit and db tests log them; the e2e app
      # hands them to the stack's Mailpit (spec 0012, AC-23, set in playwright.config.ts).
      EMAIL_TRANSPORT: log
      MAILPIT_URL: http://127.0.0.1:55324
      # spec 0012, AC-8: the Send Email Hook. `supabase start` reads both through env() in
      # supabase/config.toml, and the app checks the signature with the secret. A CI only value.
      SEND_EMAIL_HOOK_SECRET: v1,whsec_Y2ktb25seS1zZW5kLWVtYWlsLWhvb2stc2VjcmV0LTAx
      SEND_EMAIL_HOOK_URI: http://host.docker.internal:3000/api/auth/send-email
      # Only the db suites use a database. DIRECT_URL stays unset on purpose: the test:db
      # guard refuses a TEST_DATABASE_URL that matches it, and the runner migrates the test DB itself.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bestore_test
    services:
      postgres:
        # Same major version as the Supabase stack (supabase/config.toml).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm exec playwright install --with-deps chromium
      # Admin sign in e2e runs against a real local Supabase stack (spec 0004), never a mock.
      # Services the app does not use stay off; Mailpit stays on for the password reset and
      # account tests (spec 0012) and Storage for the product image upload (spec 0005). On Linux
      # the CLI maps host.docker.internal to the runner, so the auth container reaches the hook.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor
      # `supabase start` does not apply Prisma migrations. NEXT_PUBLIC_* values are baked in at
      # build time, so the stack's keys are mapped before `pnpm build` (the Playwright web server).
      - name: Map Supabase keys and migrate
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres"
            echo "DIRECT_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CART_COOKIE_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            echo "CRON_SECRET=cccccccccccccccccccccccccccccccc"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "STORE_CURRENCY=EUR"
            echo "STORE_COUNTRY=PL"
            echo "STORE_TIMEZONE=Europe/Warsaw"
            echo "STORE_LOCALE=en"
            # A real Stripe test key lets the e2e reach Stripe's hosted page (spec 0006); a fork
            # without the secret builds on a placeholder and that one test skips. Events are
            # signed in the tests with this fixed webhook secret.
            echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_placeholder}"
            echo "STRIPE_WEBHOOK_SECRET=whsec_ci_webhook_secret"
            # spec 0011, AC-16: emails are logged, never sent (the e2e app uses Mailpit instead).
            echo "EMAIL_TRANSPORT=log"
            echo "EMAIL_FROM=BeStore <orders@example.com>"
          } >> "$GITHUB_ENV"
      - run: pnpm exec prisma migrate deploy
      - run: pnpm test:stack
      # Accessibility, keyboard and admin sign in tests against a production build. VERCEL_ENV
      # stays unset, so /style-guide is served.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
